name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  phpunit:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: true
      matrix:
        include:
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
            stability: prefer-lowest
          - php: '8.1'
            laravel: '10.*'
            testbench: '8.*'
            stability: prefer-stable
          - php: '8.2'
            laravel: '11.*'
            testbench: '9.*'
            stability: prefer-stable
          - php: '8.3'
            laravel: '11.*'
            testbench: '9.*'
            stability: prefer-stable
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            stability: prefer-stable
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            stability: prefer-stable
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            stability: prefer-stable
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            stability: prefer-stable

    name: PHP ${{ matrix.php }} - Laravel ${{ matrix.laravel }} (${{ matrix.stability }})

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_pgsql, pgsql
          coverage: none

      - name: Install dependencies
        env:
          COMPOSER_NO_SECURITY_BLOCKING: 1
          COMPOSER_NO_AUDIT: 1
        run: |
          composer require --dev "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: Execute tests
        env:
          DB_TEST_HOST: 127.0.0.1
          DB_TEST_PORT: 5432
          DB_TEST_DATABASE: postgres
          DB_TEST_USERNAME: postgres
          DB_TEST_PASSWORD: postgres
        run: ./vendor/bin/phpunit
